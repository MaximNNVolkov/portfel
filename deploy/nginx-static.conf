    # Статика фронта: сжатие, кэш и типы (прогон 01.10, П22). Вставить в 443-server
    # /etc/nginx/sites-available/portfel стенда; в Docker-проде то же уже есть в
    # nginx/nginx.conf.template. Директивы expires не сбрасывают add_header сервера —
    # заголовки безопасности (CSP, HSTS и т. д.) остаются на всех ответах.
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Сборка Vite кладёт в /assets/ файлы с хэшем в имени: содержимое по адресу не меняется.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # index.html и сервис-воркер должны перепроверяться при каждом заходе, иначе
    # пользователь не увидит новую версию после выкладки.
    location = /index.html { expires epoch; }
    location = /sw.js { expires epoch; }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires epoch;
    }
