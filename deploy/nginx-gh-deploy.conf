    # Вебхук GitHub (workflow_run) -> мгновенный тик автодеплоя стенда.
    # Слушатель portfel-deploy-hook.service проверяет HMAC-подпись и сам ничего не решает
    # по payload'у: он только запускает portfel-autodeploy.service, который заново
    # спрашивает у GitHub API статус CI. Порт 22 наружу закрыт, поэтому пинок идёт по 443.
    location = /gh-deploy {
        proxy_pass http://127.0.0.1:9077/gh-deploy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Слушатель отвечает сразу (сборку ведёт systemd в фоне).
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }
