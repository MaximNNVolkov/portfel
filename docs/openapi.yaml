openapi: 3.1.0
info:
  title: Портфель — REST API
  version: 1.0.0
  description: |
    API веб-приложения для учёта инвестиционного портфеля (SPEC §33).

    Все суммы — числа в валюте, указанной рядом (`currency`), либо в базовой валюте
    портфеля (`baseCurrency`, поля с суффиксом `Base`). Отсутствие оценки передаётся
    как `null`, никогда не как 0 (§7.3).

    Авторизация — заголовок `Authorization: Bearer <token>` или httpOnly-cookie
    `portfel_session` (её ставят `/api/auth/register` и `/api/auth/login`, ими же выдаётся
    токен). Изменяющий запрос (не GET/HEAD/OPTIONS) без Bearer должен нести заголовок
    `X-Requested-With: portfel`, иначе 403 — защита от CSRF. Ошибки — JSON `{ "error": "текст", "field"?: "поле" }`.

    Пагинация списков — `limit` (1–500) и `offset`. Без них возвращается весь список.

    Файл сверяется с маршрутами `server/index.ts` тестом `server/openapi.test.ts`.
servers:
  - url: /
security:
  - bearer: []
  - cookie: []

tags:
  - name: auth
  - name: settings
  - name: brokers
  - name: market-data
  - name: positions
  - name: ocr
  - name: portfolio
  - name: payouts
  - name: transactions
  - name: system

paths:
  /api/health:
    get:
      tags: [system]
      summary: Проверка живости API
      security: []
      responses:
        '200':
          description: API работает
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, service: { type: string } } }

  /api/auth/register:
    post:
      tags: [auth]
      summary: Регистрация по email и паролю (§5)
      description: Если на сервере задан `REGISTRATION_INVITE_CODE`, требуется `inviteCode`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                inviteCode: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Вход
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Выход — удаляет текущую сессию
      responses:
        '204': { description: 'Сессия удалена' }
        '401': { $ref: '#/components/responses/Error' }

  /api/auth/me:
    get:
      tags: [auth]
      summary: Текущий пользователь
      responses:
        '200':
          description: Пользователь авторизован
          content:
            application/json:
              schema: { type: object, properties: { authenticated: { type: boolean }, email: { type: [string, 'null'] } } }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [auth]
      summary: Удалить аккаунт и все связанные данные (§28)
      responses:
        '204': { description: 'Аккаунт и данные удалены' }
        '401': { $ref: '#/components/responses/Error' }

  /api/auth/forgot-password:
    post:
      tags: [auth]
      summary: Письмо со ссылкой для восстановления пароля
      description: Ответ одинаков независимо от того, существует ли аккаунт.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200':
          description: Запрос принят
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string } } }
        '429': { $ref: '#/components/responses/Error' }

  /api/auth/reset-password:
    post:
      tags: [auth]
      summary: Новый пароль по токену из письма; завершает все сессии пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '204': { description: 'Пароль изменён' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/settings:
    get:
      tags: [settings]
      summary: Настройки портфеля
      responses:
        '200': { $ref: '#/components/responses/Settings' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [settings]
      summary: Изменить название портфеля, базовую валюту (§13) и целевую структуру
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                portfolioName: { type: string }
                baseCurrency: { type: string, enum: [RUB, USD, CNY] }
                targetAllocation: { $ref: '#/components/schemas/TargetAllocation' }
      responses:
        '200': { $ref: '#/components/responses/Settings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/brokers/tinkoff:
    get:
      tags: [brokers]
      summary: Состояние подключения Т-Инвестиций (§19, §30)
      responses:
        '200':
          description: Статус подключения; токен только в маскированном виде
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, const: tinkoff }
                  status: { type: string, enum: [disconnected, connected, error] }
                  maskedToken: { type: string }
                  connectedAt: { type: string, format: date-time }
                  lastSyncAt: { type: [string, 'null'], format: date-time }
                  lastError: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Error' }

  /api/brokers/tinkoff/connect:
    post:
      tags: [brokers]
      summary: Проверить и сохранить токен Т-Инвестиций (хранится зашифрованным)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '200': { description: 'Токен подтверждён и сохранён' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/brokers/tinkoff/sync:
    post:
      tags: [brokers]
      summary: Синхронизировать счета, позиции и операции
      description: При ошибке ранее загруженные данные сохраняются, статус подключения становится `error` (§40.2).
      responses:
        '200': { description: 'Синхронизация завершена' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/market-data/refresh:
    post:
      tags: [market-data]
      summary: Обновить цены акций, фондов и облигаций по MOEX ISS (§20)
      responses:
        '200':
          description: Итог обновления по каждой бумаге
          content:
            application/json:
              schema:
                type: object
                properties:
                  checked: { type: integer }
                  updated: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        positionId: { type: string, format: uuid }
                        name: { type: string }
                        code: { type: string }
                        status: { type: string, enum: [updated, no_quantity, not_found, no_price, unavailable] }
                        priceUpdatedAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Error' }

  /api/market-data/search:
    get:
      tags: [market-data]
      summary: Поиск акций, облигаций и фондов MOEX по тикеру, названию или ISIN (§17, §20)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 64 } }
      responses:
        '200':
          description: До 10 торгуемых бумаг; запрос короче двух символов — пустой список
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    secid: { type: string }
                    shortName: { type: string }
                    name: { type: string }
                    isin: { type: string }
                    group: { type: string, enum: [share, bond, fund] }
        '401': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/market-data/securities/{secid}:
    get:
      tags: [market-data]
      summary: Описание и текущая цена бумаги MOEX для автозаполнения формы
      parameters:
        - { name: secid, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Параметры бумаги; цена облигации — в деньгах за одну бумагу, не в % от номинала
          content:
            application/json:
              schema:
                type: object
                properties:
                  secid: { type: string }
                  name: { type: string }
                  shortName: { type: string }
                  isin: { type: string }
                  group: { type: string, enum: [share, bond, fund] }
                  currency: { type: string }
                  price: { type: number, nullable: true }
                  accruedInterest: { type: number, nullable: true }
                  nominal: { type: number }
                  couponRate: { type: number }
                  nextCouponDate: { type: string, format: date }
                  maturityDate: { type: string, format: date }
                  offerDate: { type: string, format: date }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/positions:
    get:
      tags: [positions]
      summary: Позиции портфеля с оценкой Portfolio Engine
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Список позиций
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Position' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [positions]
      summary: Добавить инструмент вручную (§17)
      description: >-
        Для облигаций, акций и фондов достаточно тикера и количества (без суммы): название,
        ISIN, валюта, купон, погашение и текущая цена берутся с MOEX. Цена покупки
        (averagePrice) необязательна — без неё вложено считается по текущей цене.
      requestBody: { $ref: '#/components/requestBodies/PositionCreate' }
      responses:
        '201': { $ref: '#/components/responses/Position' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/positions/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [positions]
      summary: Карточка позиции (§9)
      responses:
        '200': { $ref: '#/components/responses/Position' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [positions]
      summary: Изменить позицию; передаются только изменённые поля
      requestBody: { $ref: '#/components/requestBodies/PositionUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Position' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [positions]
      summary: Удалить позицию
      responses:
        '204': { description: 'Удалена' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/accounts:
    get:
      tags: [positions]
      summary: Счета пользователя (§11 Account)
      responses:
        '200':
          description: Список счетов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    type: { type: string, enum: [broker, bank, cash, other] }
                    provider: { type: string }
                    currency: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /api/instruments:
    get:
      tags: [positions]
      summary: Инструменты пользователя (§11 Instrument)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Список инструментов
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Error' }

  /api/ocr/upload:
    post:
      tags: [ocr]
      summary: Загрузить скриншот в очередь распознавания (§18, §34)
      description: |
        Распознавание асинхронное: ответ 202 с `documentId`, статус опрашивается через
        `GET /api/ocr/documents/{id}`. Повторная загрузка того же файла возвращает 200 и
        прошлый документ с `alreadyUploadedAt`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: 'PNG или JPEG до 10 МБ' }
      responses:
        '200': { $ref: '#/components/responses/OcrQueued' }
        '202': { $ref: '#/components/responses/OcrQueued' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/ocr/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [ocr]
      summary: Статус и результат распознавания
      responses:
        '200':
          description: Документ
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId: { type: string, format: uuid }
                  status: { type: string, enum: [pending, processing, done, failed] }
                  fileName: { type: string }
                  createdAt: { type: string, format: date-time }
                  processedAt: { type: [string, 'null'], format: date-time }
                  result:
                    description: Только при status = done — данные экрана-сводки (§40.4)
                    type: object
                    properties:
                      date: { type: string }
                      items: { type: array, items: { type: object, additionalProperties: true } }
                      failures: { type: array, items: { type: object, additionalProperties: true } }
                  error: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/portfolio/summary:
    get:
      tags: [portfolio]
      summary: Главный экран — итоги портфеля (§7.1, §10.6)
      responses:
        '200':
          description: Итоги в базовой валюте
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Summary' }
        '401': { $ref: '#/components/responses/Error' }

  /api/portfolio/history:
    get:
      tags: [portfolio]
      summary: Ежедневные снимки стоимости портфеля (§21)
      responses:
        '200':
          description: Снимки по датам
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, format: date }
                    value: { type: number }
                    invested: { type: [number, 'null'] }
                    result: { type: [number, 'null'], description: Финансовый результат на дату снимка }
        '401': { $ref: '#/components/responses/Error' }

  /api/portfolio/returns:
    get:
      tags: [portfolio]
      summary: Доходность за день, месяц, год и всё время по снимкам (§23)
      description: |
        Результат периода — изменение финансового результата (§10.6) между снимками, процент —
        к стоимости на начало периода. Период без снимка рядом с его началом не возвращается.
      responses:
        '200':
          description: Периоды, для которых хватает истории
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    period: { type: string, enum: [day, month, year, all] }
                    from: { type: string, format: date }
                    result: { type: number }
                    percent: { type: [number, 'null'] }
        '401': { $ref: '#/components/responses/Error' }

  /api/imports/statement/preview:
    post:
      tags: [transactions]
      summary: Предпросмотр импорта банковской выписки (CSV)
      description: |
        Разбирает CSV, угадывает колонки (или берёт выбранные) и показывает, сколько строк
        найдено, сколько с ошибкой и сколько уже загружалось. Ничего не записывает.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementImportRequest' }
      responses:
        '200':
          description: Колонки, выбранное сопоставление, строки и счётчики
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers: { type: array, items: { type: string } }
                  mapping: { $ref: '#/components/schemas/StatementMapping' }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        line: { type: integer }
                        date: { type: string, format: date }
                        amount: { type: number }
                        type: { type: string, enum: [DEPOSIT, WITHDRAW, INTEREST] }
                        currency: { type: string }
                        description: { type: string }
                        error: { type: string }
                        duplicate: { type: boolean }
                        skipped: { type: boolean }
                  counts: { $ref: '#/components/schemas/StatementImportCounts' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/imports/statement:
    post:
      tags: [transactions]
      summary: Загрузить операции из банковской выписки
      description: Строки с ошибкой и уже загруженные пропускаются; повторная загрузка того же файла ничего не задваивает.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementImportRequest' }
      responses:
        '201':
          description: Сколько операций добавлено и пропущено
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  duplicates: { type: integer }
                  errors: { type: integer }
                  skipped: { type: integer }
                  batch: { type: string, description: 'Идентификатор загрузки для отмены' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/imports/statement/{batch}:
    delete:
      tags: [transactions]
      summary: Отменить загрузку выписки
      description: Удаляет операции, добавленные этой загрузкой, вместе с их выплатами.
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Сколько операций удалено
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/tax/estimate:
    get:
      tags: [portfolio]
      summary: Оценка НДФЛ за год по операциям
      description: |
        Оценка, а не расчёт налогового агента: валюта пересчитывается по текущему курсу ЦБ,
        убытки прошлых лет, ИИС и льготы не учитываются. Проценты по вкладам облагаются
        сверх 1 млн ₽ × максимальная ключевая ставка года.
      parameters:
        - { name: year, in: query, schema: { type: integer }, description: Год, по умолчанию текущий }
      responses:
        '200':
          description: Строки оценки и итог
          content:
            application/json:
              schema:
                type: object
                properties:
                  year: { type: integer }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, enum: [deposit_interest, coupons, dividends, sales] }
                        label: { type: string }
                        income: { type: number }
                        exempt: { type: number }
                        taxBase: { type: number }
                        how: { type: string }
                  taxBase: { type: number }
                  tax: { type: number }
                  withheld: { type: number }
                  toPay: { type: number }
                  keyRate: { type: number }
                  keyRateAssumed: { type: boolean }
                  unconverted: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/tax/export:
    get:
      tags: [portfolio]
      summary: Доходы за год в CSV для 3-НДФЛ
      parameters:
        - { name: year, in: query, schema: { type: integer }, description: Год, по умолчанию текущий }
      responses:
        '200':
          description: CSV для Excel (точка с запятой, UTF-8 с BOM)
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/portfolio/structure:
    get:
      tags: [portfolio]
      summary: Структура портфеля по разрезам (§23)
      responses:
        '200':
          description: Разрезы по валютам, брокерам, банкам, инструментам и эмитентам
          content:
            application/json:
              schema:
                type: object
                properties:
                  byCurrency: { type: array, items: { $ref: '#/components/schemas/Breakdown' } }
                  byBroker: { type: array, items: { $ref: '#/components/schemas/Breakdown' } }
                  byBank: { type: array, items: { $ref: '#/components/schemas/Breakdown' } }
                  byProvider: { type: array, items: { $ref: '#/components/schemas/Breakdown' }, description: 'Где лежат деньги — банк или брокер без разделения' }
                  byInstrument: { type: array, items: { $ref: '#/components/schemas/Breakdown' } }
                  byIssuer: { type: array, items: { $ref: '#/components/schemas/Breakdown' } }
        '401': { $ref: '#/components/responses/Error' }

  /api/recommendations:
    get:
      tags: [portfolio]
      summary: Аналитические уведомления — 4 базовых правила (§24)
      description: Не являются индивидуальными инвестиционными рекомендациями.
      responses:
        '200':
          description: Список уведомлений
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ruleType: { type: string, enum: [concentration, maturity, drawdown, payout_gap] }
                    text: { type: string }
                  additionalProperties: true
        '401': { $ref: '#/components/responses/Error' }

  /api/attention:
    get:
      tags: [portfolio]
      summary: 'Лента «Что требует внимания»: выплаты, погашения, ошибки брокера, аналитика'
      responses:
        '200':
          description: Пункты ленты, срочные первыми
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AttentionItem' } }
        '401': { $ref: '#/components/responses/Error' }

  /api/payouts:
    get:
      tags: [payouts]
      summary: Календарь выплат (§22)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Выплаты по возрастанию даты
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Payout' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [payouts]
      summary: Добавить выплату вручную
      requestBody: { $ref: '#/components/requestBodies/PayoutCreate' }
      responses:
        '201': { $ref: '#/components/responses/Payout' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/payouts/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    patch:
      summary: 'Изменить выплату; positionId = null отвязывает от инструмента'
      description: 'Статус received заводит связанную операцию (деньги попадают в свободные), expected — удаляет её; у брокерских выплат операции приходят синхронизацией'
      summary: 'Изменить выплату; positionId = null отвязывает от инструмента'
      requestBody: { $ref: '#/components/requestBodies/PayoutUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Payout' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [payouts]
      summary: Удалить выплату
      responses:
        '204': { description: 'Удалена' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/transactions:
    get:
      tags: [transactions]
      summary: Операции (§11 Transaction)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Список операций
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [transactions]
      summary: Добавить операцию; меняет позицию или денежный остаток
      requestBody: { $ref: '#/components/requestBodies/TransactionCreate' }
      responses:
        '201': { $ref: '#/components/responses/Transaction' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    patch:
      tags: [transactions]
      summary: Изменить операцию
      requestBody: { $ref: '#/components/requestBodies/TransactionUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Transaction' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [transactions]
      summary: Удалить операцию и откатить её эффект
      responses:
        '204': { description: 'Удалена' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    cookie:
      type: apiKey
      in: cookie
      name: portfel_session

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500 }
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0 }

  schemas:
    StatementMapping:
      type: object
      description: Номера колонок (с 0); null — колонка не используется.
      properties:
        date: { type: [integer, 'null'] }
        amount: { type: [integer, 'null'] }
        income: { type: [integer, 'null'] }
        expense: { type: [integer, 'null'] }
        description: { type: [integer, 'null'] }
        currency: { type: [integer, 'null'] }
        status: { type: [integer, 'null'], description: Статус операции; непроведённые не загружаются }
    StatementImportRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, description: Содержимое CSV-файла выписки }
        mapping: { $ref: '#/components/schemas/StatementMapping' }
        exclude: { type: array, items: { type: integer }, description: Номера строк файла, которые не загружать }
        only: { type: string, enum: [all, income], description: income — только поступления и проценты }
        institution: { type: string, description: Банк выписки — операции попадут на его счёт }
    StatementImportCounts:
      type: object
      properties:
        found: { type: integer }
        errors: { type: integer }
        duplicates: { type: integer }
        skipped: { type: integer }
        toImport: { type: integer }
        incomeRub: { type: number }
        expenseRub: { type: number }
    Error:
      type: object
      properties:
        error: { type: string }
        field: { type: string, description: 'Поле формы, к которому относится ошибка' }

    Valuation:
      type: object
      description: Оценка Portfolio Engine в базовой валюте (§10)
      properties:
        value: { type: [number, 'null'] }
        invested: { type: [number, 'null'] }
        pnl: { type: [number, 'null'] }
        pnlPercent: { type: [number, 'null'] }
        priceUnavailable: { type: boolean }
        priceUnavailableReason: { type: [string, 'null'], enum: [no-price, no-rate, null] }
        estimated: { type: boolean, description: 'Котируемая бумага без котировки — в стоимости есть, в P&L нет' }
        accruedInterest: { type: [number, 'null'], description: 'НКД облигации или начисленные, но не выплаченные проценты вклада (оценка по ставке), в валюте инструмента' }
      additionalProperties: true

    Position:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [Вклады, Облигации, Акции, Фонды, Деньги, Прочее] }
        amount: { type: [number, 'null'], description: 'Текущая стоимость в валюте инструмента; null — цены нет' }
        invested: { type: [number, 'null'] }
        currency: { type: string }
        institution: { type: string, description: 'Банк или брокер' }
        source: { type: string, enum: [manual, ocr, broker] }
        ticker: { type: string }
        isin: { type: [string, 'null'] }
        quantity: { type: [number, 'null'] }
        averagePrice: { type: [number, 'null'] }
        currentPrice: { type: [number, 'null'] }
        maturityDate: { type: [string, 'null'], format: date }
        closedOn: { type: [string, 'null'], format: date }
        forecastNote: { type: string, description: 'Почему по бумаге нет прогноза купонов' }
        valuation: { $ref: '#/components/schemas/Valuation' }
        outlook:
          type: [object, 'null']
          description: 'Прогноз поступлений по инструменту в базовой валюте (server/payout-outlook.ts); null — выплат нет. Суммы null — нет курса ЦБ для части выплат'
          properties:
            receivedIncome: { type: [number, 'null'], description: 'Полученные купоны, проценты, дивиденды' }
            expectedIncome: { type: [number, 'null'], description: 'Ожидаемый доход с сегодняшнего дня до конца графика' }
            expectedPrincipal: { type: [number, 'null'], description: 'Ожидаемый возврат тела вклада или номинала' }
            overduePrincipal: { type: [number, 'null'], description: 'Возврат вложенного с прошедшей датой, не отмеченный полученным' }
            next:
              type: [object, 'null']
              properties:
                date: { type: string, format: date }
                types: { type: array, items: { type: string } }
                amount: { type: [number, 'null'] }
                forecast: { type: boolean }
            lastDate: { type: [string, 'null'], format: date }
            expectedCount: { type: integer }
      additionalProperties: true

    Payout:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        amount: { type: number, description: 'В валюте выплаты' }
        currency: { type: string }
        amountBase: { type: [number, 'null'], description: 'В базовой валюте по курсу ЦБ; null — курса нет' }
        baseCurrency: { type: [string, 'null'] }
        date: { type: string, format: date }
        type: { type: string, enum: [COUPON, DIVIDEND, INTEREST, DEPOSIT_PRINCIPAL, REDEMPTION, OTHER] }
        status: { type: string, enum: [expected, received], description: 'Купон, проценты и дивиденды с прошедшей датой всегда received — сервер переводит их сам и заводит операцию' }
        overdue: { type: boolean, description: 'Ожидалась, но дата прошла (только возврат тела вклада и погашение)' }
        reinvested: { type: boolean, description: 'Пришедшие деньги отмечены вложенными — напоминание «Реинвестировать» снято' }
        source: { type: string }
        instrumentId: { type: [string, 'null'] }
        accountId: { type: string }
        institution: { type: [string, 'null'], description: 'Банк или брокер счёта' }
        transactionId: { type: [string, 'null'] }

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TransactionType' }
        title: { type: string }
        amount: { type: number }
        date: { type: string, format: date }
        currency: { type: string }
        commission: { type: number }
        tax: { type: number }
        quantity: { type: [number, 'null'], description: 'Количество бумаг в покупке/продаже' }
        price: { type: [number, 'null'], description: 'Цена за штуку' }
        positionId: { type: [string, 'null'] }
        instrumentId: { type: [string, 'null'] }
        accountId: { type: string }
        institution: { type: [string, 'null'], description: 'Банк или брокер счёта' }
        source: { type: string }

    TargetAllocation:
      type: object
      description: 'Целевые доли категорий, % (в сумме 100). Пустой объект — цель снята'
      properties:
        Вклады: { type: number }
        Облигации: { type: number }
        Акции: { type: number }
        Фонды: { type: number }
        Деньги: { type: number }
        Прочее: { type: number }
      additionalProperties: false

    TransactionType:
      type: string
      enum: [BUY, SELL, DEPOSIT, WITHDRAW, COUPON, DIVIDEND, INTEREST, FEE, TAX, REDEMPTION, OTHER]

    PositionInput:
      type: object
      description: При создании обязательны type, name, amount, date (§17)
      properties:
        type: { type: string, enum: [Вклады, Облигации, Акции, Фонды, Деньги, Прочее] }
        name: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        date: { type: string, format: date }
        invested: { type: number, description: 'Должно совпадать с quantity × averagePrice, если заданы оба' }
        institution: { type: string }
        currency: { type: string, enum: [RUB, USD, CNY] }
        ticker: { type: string }
        isin: { type: string }
        issuer: { type: string }
        quantity: { type: number }
        averagePrice: { type: number }
        currentPrice: { type: number }
        accruedInterest: { type: number }
        nominal: { type: number }
        couponRate: { type: number }
        couponDate: { type: string, format: date }
        maturityDate: { type: string, format: date }
        ofertaDate: { type: string, format: date }
        rate: { type: number }
        effectiveRate: { type: number }
        termEndDate: { type: string, format: date }
        capitalization: { type: boolean }
        replenishable: { type: boolean }
        partialWithdrawal: { type: boolean }
        autoProlongation: { type: boolean }
      additionalProperties: true
    PayoutInput:
      type: object
      description: При создании обязательны title, amount, date
      properties:
        title: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        date: { type: string, format: date }
        type: { type: string, enum: [COUPON, DIVIDEND, INTEREST, DEPOSIT_PRINCIPAL, REDEMPTION, OTHER] }
        status: { type: string, enum: [expected, received] }
        positionId: { type: [string, 'null'], description: 'Привязка к инструменту; валюта берётся из него' }
        reinvested: { type: boolean, description: 'Только при изменении: отметить пришедшие деньги вложенными (true) или снять отметку (false)' }
    TransactionInput:
      type: object
      description: При создании обязательны type, amount, date; для BUY и SELL — positionId. COUPON, DIVIDEND и INTEREST можно привязать к позиции (positionId, null — отвязать)
      properties:
        type: { $ref: '#/components/schemas/TransactionType' }
        amount: { type: number, exclusiveMinimum: 0 }
        date: { type: string, format: date }
        title: { type: string }
        positionId: { type: string }
        quantity: { type: number, exclusiveMinimum: 0, description: 'Для BUY/SELL. Не задано — выводится из price или текущей цены позиции' }
        price: { type: number, exclusiveMinimum: 0 }
        commission: { type: number }
        tax: { type: number }

    AttentionItem:
      type: object
      required: [id, kind, severity, title, text, action]
      properties:
        id: { type: string }
        kind: { type: string, enum: [payout_overdue, payout_received, payout_soon, maturity_soon, broker_error, price_unavailable, forecast_missing, insight] }
        severity: { type: integer, enum: [1, 2, 3], description: '1 — срочно, 2 — важно, 3 — к сведению' }
        title: { type: string }
        text: { type: string }
        action: { type: string, enum: [mark_received, reinvest, open_position, edit_position, refresh_prices, open_integrations, open_payments, open_analytics] }
        date: { type: string, format: date }
        amount: { type: number }
        currency: { type: string }
        institution: { type: string }
        positionId: { type: string }
        payoutIds: { type: array, items: { type: string } }

    Breakdown:
      type: object
      properties:
        key: { type: string }
        invested: { type: number }
        value: { type: number }
        pnl: { type: number, description: 'Только по позициям с известной ценой' }
        pnlPercent: { type: [number, 'null'] }
        share: { type: [number, 'null'] }
        positions: { type: integer }
        priceUnavailable: { type: integer }

    Summary:
      type: object
      properties:
        baseCurrency: { type: string }
        total: { type: number }
        invested: { type: number }
        profit: { type: number }
        profitPercent: { type: [number, 'null'] }
        expected: { type: number, description: 'Ожидаемый доход с сегодняшнего дня: купоны, проценты, дивиденды' }
        expectedPrincipal: { type: number, description: 'Ожидаемый возврат вложений: тело вклада и погашение номинала' }
        overdue: { type: number }
        paid: { type: number }
        cash: { type: [number, 'null'] }
        cashShortfall:
          type: array
          description: Валюты, где расходов в операциях больше поступлений; минус в стоимость не входит.
          items:
            type: object
            properties:
              currency: { type: string }
              amount: { type: number }
        positions: { type: integer }
        financialResult: { type: [number, 'null'], description: 'изменение стоимости + выплаты − комиссии − налоги (§10.6)' }
        returnPercent: { type: [number, 'null'] }
        returnMethod: { type: string, const: simple }
        commissions: { type: number }
        taxes: { type: number }
        groups: { type: array, items: { type: object, additionalProperties: true } }
        valueChange: { type: [number, 'null'], description: 'Изменение цены позиций (стоимость − вложено)' }
        contributed: { type: [number, 'null'], description: 'Внесено своих денег: итог − финансовый результат' }
        rebalance:
          type: array
          description: 'Целевая структура по категориям; пусто, если цель не задана'
          items:
            type: object
            properties:
              group: { type: string }
              target: { type: number, description: 'Целевая доля, %' }
              actual: { type: number, description: 'Текущая доля, %' }
              deviation: { type: number, description: 'Текущая минус целевая, п. п.' }
              toTarget: { type: number, description: 'Докупить (> 0) или выше цели (< 0), в базовой валюте' }
        valuation:
          type: object
          properties:
            incomplete: { type: boolean, description: 'Итог неполный — UI помечает его (§40.2)' }
            unavailable: { type: array, items: { type: object, additionalProperties: true } }
            estimated: { type: array, items: { type: object, additionalProperties: true } }
            unconvertedCurrencies: { type: array, items: { type: string }, description: 'Валюты без курса ЦБ, не вошедшие в суммы выплат и комиссий' }

  requestBodies:
    PositionCreate:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PositionInput'
              - required: [name, amount, date]
              - properties:
                  fromCash:
                    type: boolean
                    description: 'Купить на свободные деньги (реинвестирование): заводится операция BUY, 400 — если денег в валюте продукта не хватает'
    PositionUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PositionInput' }
    PayoutCreate:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PayoutInput'
              - required: [title, amount, date]
    PayoutUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PayoutInput' }
    TransactionCreate:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/TransactionInput'
              - required: [type, amount, date]
    TransactionUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TransactionInput' }

  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Session:
      description: Сессия создана
      content:
        application/json:
          schema:
            type: object
            properties:
              token: { type: string }
              user: { type: object, properties: { id: { type: string }, email: { type: string } } }
    Settings:
      description: Настройки портфеля
      content:
        application/json:
          schema:
            type: object
            properties:
              portfolioName: { type: string }
              baseCurrency: { type: string }
              availableCurrencies: { type: array, items: { type: string } }
              targetAllocation: { $ref: '#/components/schemas/TargetAllocation' }
    Position:
      description: Позиция
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Position' }
    Payout:
      description: Выплата
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Payout' }
    Transaction:
      description: Операция
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Transaction' }
    OcrQueued:
      description: Документ в очереди или уже обработан
      content:
        application/json:
          schema:
            type: object
            properties:
              documentId: { type: string, format: uuid }
              status: { type: string }
              alreadyUploadedAt: { type: string, format: date-time }
