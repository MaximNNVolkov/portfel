version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfel-postgres
    restart: unless-stopped
    # Порт наружу намеренно не публикуется (§28): база доступна только сервисам внутри
    # compose-сети. Для ручного доступа — `docker compose exec postgres psql -U $POSTGRES_USER`.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfel}
      POSTGRES_USER: ${POSTGRES_USER:-portfel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env — пароль базы не должен браться из репозитория}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: portfel-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Включает строгие проверки секретов при старте (server/token-crypto.ts, server/index.ts).
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/server/uploads
    # Зависший (а не упавший) процесс restart: unless-stopped не ловит — healthcheck
    # помечает контейнер unhealthy, а nginx стартует только после первого успешного ответа.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: portfel-nginx
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    container_name: portfel-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >-
      sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'

  backup:
    image: postgres:16-alpine
    container_name: portfel-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-portfel}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      PGDATABASE: ${POSTGRES_DB:-portfel}
      BACKUP_RETENTION_COUNT: 7
      BACKUP_INTERVAL_SECONDS: 86400
    volumes:
      - postgres_backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/restore.sh:/restore.sh:ro
    entrypoint: ["sh", "/backup.sh"]

  # §19/§21/§32: ежедневные snapshots, автосинхронизация брокера и обновление цен MOEX —
  # раньше только по явному действию пользователя. Тот же образ, что и backend (тот же код,
  # server/scheduler.ts переиспользует server/daily-tasks.ts), но отдельный процесс/контейнер,
  # а не встроенный в HTTP-сервер таймер — падение или рестарт backend не должны влиять
  # на фоновые задачи и наоборот.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: portfel-scheduler
    restart: unless-stopped
    command: ["node", "dist-server/scheduler.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SCHEDULER_INTERVAL_SECONDS: 86400
      # §34: очередь OCR обрабатывается тем же процессом, но своим быстрым циклом —
      # загруженный скриншот не может ждать суточного такта.
      OCR_POLL_SECONDS: 2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Тот же том, что у backend: HTTP-обработчик кладёт сюда загруженный файл,
      # а распознаёт его воркер планировщика — без общего тома он не увидит файл.
      - backend_uploads:/app/server/uploads

volumes:
  postgres_data:
  backend_uploads:
  postgres_backups:
