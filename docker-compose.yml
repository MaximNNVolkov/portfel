version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: portfel
      POSTGRES_USER: portfel
      POSTGRES_PASSWORD: portfel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfel -d portfel"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: portfel-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/server/uploads

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: portfel-nginx
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    container_name: portfel-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >-
      sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'

  backup:
    image: postgres:16-alpine
    container_name: portfel-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: portfel
      PGPASSWORD: portfel
      PGDATABASE: portfel
      BACKUP_RETENTION_COUNT: 7
      BACKUP_INTERVAL_SECONDS: 86400
    volumes:
      - postgres_backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/restore.sh:/restore.sh:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  postgres_data:
  backend_uploads:
  postgres_backups:
