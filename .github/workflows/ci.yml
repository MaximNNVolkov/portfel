name: CI

on:
  push:
  pull_request:
  # Ручной запуск: если GitHub не создал прогон на push в main (так было 01.10 с #36),
  # автодеплой стенда ждёт зелёный CI и без этого не выложит коммит.
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (frontend)
        run: npx tsc -b

      - name: Typecheck (server)
        run: npx tsc -p tsconfig.server.json

      - name: Lint
        run: npm run lint

      - name: Build server (JS for the production image)
        run: npm run build:server

      # Юнит-тесты без БД. server/smoke-test.ts (npm test) требует живой Postgres и сюда не входит.
      - name: Unit tests
        run: |
          failed=0
          for f in server/*.test.ts; do
            echo "::group::$f"
            npx tsx "$f" || failed=1
            echo "::endgroup::"
          done
          exit $failed

  # Production-образ backend собирается (tsc → JS, рантайм без devDependencies) и стартует
  # хотя бы до проверки секретов. Языковые данные OCR (tessdata/*.traineddata) в git не лежат —
  # для сборки хватает пустого каталога.
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          mkdir -p tessdata
          docker build -f Dockerfile.backend -t portfel-backend:ci .

      - name: No tsx/typescript in the runtime image
        run: |
          ! docker run --rm portfel-backend:ci sh -c 'ls node_modules/.bin' | grep -E '^(tsx|tsc)$'

      - name: Compiled backend loads and refuses to start without secrets
        run: |
          out=$(docker run --rm -e NODE_ENV=production portfel-backend:ci node dist-server/index.js 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q TOKEN_ENCRYPTION_KEY

  # Автодеплой на стенд (docs/STAND.md, раздел «Автоматическая выкладка»): только push в main
  # и только после зелёных checks + backend-image. Пока секреты STAND_SSH_* не заведены,
  # job завершается успешно с пометкой «пропущено», а не роняет CI.
  deploy:
    needs: [checks, backend-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-stand
      cancel-in-progress: false
    env:
      STAND_SSH_HOST: ${{ secrets.STAND_SSH_HOST }}
      STAND_SSH_USER: ${{ secrets.STAND_SSH_USER }}
      STAND_SSH_KEY: ${{ secrets.STAND_SSH_KEY }}
      STAND_SSH_KNOWN_HOSTS: ${{ secrets.STAND_SSH_KNOWN_HOSTS }}
      STAND_URL: https://portfel.176.109.108.58.nip.io
    steps:
      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -n "$STAND_SSH_HOST" ] && [ -n "$STAND_SSH_USER" ] && [ -n "$STAND_SSH_KEY" ] && [ -n "$STAND_SSH_KNOWN_HOSTS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Автодеплой пропущен: не заданы секреты STAND_SSH_HOST/USER/KEY/KNOWN_HOSTS (см. docs/STAND.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAND_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$STAND_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # На сервере ключ привязан к scripts/deploy-stand.sh (command=... в authorized_keys);
          # передаём только SHA коммита, прошедшего CI.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ConnectTimeout=20 \
            "$STAND_SSH_USER@$STAND_SSH_HOST" "$GITHUB_SHA"

      - name: Public health check
        if: steps.secrets.outputs.ready == 'true'
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$STAND_URL/api/health"
          curl -fsS --retry 3 --retry-delay 3 "$STAND_URL/" | grep -q '<div id="root">'

  # Автодеплой production (docker-compose на VPS, docs/DEPLOY.md, раздел «Автоматическая
  # выкладка»): push в main после зелёных checks + backend-image. Окружение `production`
  # позволяет включить ручное подтверждение в Settings → Environments. Пока секреты
  # PROD_SSH_* не заведены, job завершается успешно с пометкой «пропущено».
  deploy-prod:
    needs: [checks, backend-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -n "$PROD_SSH_HOST" ] && [ -n "$PROD_SSH_USER" ] && [ -n "$PROD_SSH_KEY" ] && [ -n "$PROD_SSH_KNOWN_HOSTS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Автодеплой production пропущен: не заданы секреты PROD_SSH_HOST/USER/KEY/KNOWN_HOSTS (см. docs/DEPLOY.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # На сервере ключ привязан к scripts/deploy-prod.sh (command=... в authorized_keys);
          # передаём только SHA коммита, прошедшего CI.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ConnectTimeout=20 \
            "$PROD_SSH_USER@$PROD_SSH_HOST" "$GITHUB_SHA"

      - name: Public health check
        if: steps.secrets.outputs.ready == 'true' && env.PROD_URL != ''
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$PROD_URL/api/health"
          curl -fsS --retry 3 --retry-delay 3 "$PROD_URL/" | grep -q '<div id="root">'
